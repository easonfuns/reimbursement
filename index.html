<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>協會請款系統</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --paper:#F7F5EF;
    --paper2:#EFEBE1;
    --ink:#1F2A44;
    --ink-soft:#5A6478;
    --stamp:#B33A3A;
    --ledger:#4A6741;
    --line:#D8D2C2;
    --gold:#A9852E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 34px, rgba(31,42,68,0.035) 35px);
    font-family:'Noto Sans TC', sans-serif;
    color:var(--ink);
    min-height:100vh;
  }
  header{
    padding:28px 20px 18px;
    text-align:center;
    border-bottom:2px solid var(--ink);
    position:relative;
  }
  header h1{
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size:1.5rem;
    margin:0 0 4px;
    letter-spacing:.04em;
  }
  header p{margin:0;color:var(--ink-soft);font-size:.8rem;letter-spacing:.05em;}

  nav{
    display:flex;
    justify-content:center;
    gap:0;
    margin-top:16px;
    flex-wrap:wrap;
  }
  nav button{
    font-family:'Noto Serif TC', serif;
    font-size:.82rem;
    padding:9px 14px;
    background:var(--paper2);
    border:1px solid var(--ink);
    border-bottom:none;
    color:var(--ink-soft);
    cursor:pointer;
    position:relative;
    top:1px;
    border-radius:8px 8px 0 0;
  }
  nav button.active{
    background:var(--paper);
    color:var(--ink);
    font-weight:700;
  }

  main{max-width:640px;margin:0 auto;padding:22px 16px 60px;}
  .view{display:none;}
  .view.active{display:block;}

  .sheet{
    background:var(--paper);
    border:1px solid var(--ink);
    border-radius:2px;
    padding:22px 20px;
    position:relative;
    box-shadow:0 2px 0 var(--line);
  }
  .sheet::before{
    content:"";
    position:absolute;
    top:-1px;left:16px;right:16px;height:0;
    border-top:2px dashed var(--line);
  }

  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:.8rem;
    font-weight:700;
    color:var(--ink-soft);
    margin-bottom:6px;
    letter-spacing:.03em;
  }
  .field .hint{font-size:.72rem;color:var(--ink-soft);margin-top:4px;font-weight:400;}
  input[type=text], input[type=number], select, textarea{
    width:100%;
    padding:10px 11px;
    border:1px solid var(--line);
    background:#fff;
    border-radius:4px;
    font-family:inherit;
    font-size:.92rem;
    color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{
    outline:2px solid var(--gold);
    outline-offset:1px;
  }
  textarea{resize:vertical;min-height:64px;}
  .amount-wrap{position:relative;}
  .amount-wrap input{font-family:'IBM Plex Mono', monospace;padding-left:28px;font-weight:600;}
  .amount-wrap::before{
    content:"NT$";
    position:absolute;left:11px;top:50%;transform:translateY(-50%);
    font-family:'IBM Plex Mono', monospace;font-size:.8rem;color:var(--ink-soft);
  }

  .radio-row{display:flex;gap:8px;flex-wrap:wrap;}
  .radio-row label{
    flex:1;min-width:110px;
    display:flex;align-items:center;gap:6px;
    border:1px solid var(--line);
    padding:9px 10px;border-radius:4px;
    font-size:.85rem;font-weight:400;color:var(--ink);
    cursor:pointer;background:#fff;
  }
  .radio-row input{width:auto;}
  .radio-row label:has(input:checked){
    border-color:var(--stamp);
    background:#FBF1EF;
    font-weight:700;
  }

  .photo-drop{
    border:1.5px dashed var(--line);
    border-radius:6px;
    padding:16px;
    text-align:center;
    cursor:pointer;
    background:#fff;
  }
  .photo-drop img{max-width:100%;max-height:180px;border-radius:4px;margin-top:8px;}
  .photo-drop .placeholder{color:var(--ink-soft);font-size:.85rem;}

  .submit-btn{
    width:100%;
    padding:13px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:4px;
    font-family:'Noto Serif TC', serif;
    font-size:1rem;
    font-weight:700;
    letter-spacing:.06em;
    cursor:pointer;
    margin-top:8px;
  }
  .submit-btn:active{transform:translateY(1px);}
  .submit-btn:disabled{opacity:.5;}

  .stamp{
    display:none;
    width:120px;height:120px;
    border:3px solid var(--stamp);
    border-radius:50%;
    color:var(--stamp);
    align-items:center;justify-content:center;
    flex-direction:column;
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    transform:rotate(-12deg);
    margin:18px auto 4px;
    text-align:center;
    line-height:1.3;
  }
  .stamp .big{font-size:1.15rem;}
  .stamp .small{font-size:.68rem;letter-spacing:.15em;margin-top:2px;}
  .confirm-box{display:none;text-align:center;padding:10px 0 4px;}
  .confirm-box .reset{
    margin-top:10px;background:none;border:1px solid var(--ink);color:var(--ink);
    padding:8px 18px;border-radius:4px;font-family:inherit;cursor:pointer;font-size:.85rem;
  }

  /* dashboard */
  .stat-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .stat-card{
    flex:1;min-width:130px;
    background:var(--paper2);
    border:1px solid var(--line);
    border-radius:4px;
    padding:12px 14px;
  }
  .stat-card .label{font-size:.72rem;color:var(--ink-soft);font-weight:700;}
  .stat-card .value{font-family:'IBM Plex Mono', monospace;font-size:1.3rem;font-weight:600;margin-top:3px;}
  .stat-card.warn .value{color:var(--stamp);}
  .stat-card.ok .value{color:var(--ledger);}

  select#monthFilter{max-width:160px;margin-bottom:14px;}
  .export-btn{
    padding:9px 16px;
    background:var(--ledger);
    color:#fff;
    border:none;
    border-radius:4px;
    font-family:'Noto Serif TC', serif;
    font-size:.85rem;
    font-weight:700;
    cursor:pointer;
    margin-bottom:14px;
  }
  .export-btn:active{transform:translateY(1px);}
  .refresh-btn{background:var(--ink);}

  .sync-indicator{
    font-size:.78rem;color:var(--ink-soft);margin-bottom:10px;
  }

  .status-tag{
    display:inline-block;font-size:.7rem;padding:2px 9px;border-radius:10px;
    font-weight:700;margin-right:6px;
  }
  .status-tag.pending{background:#EDE7D8;color:var(--gold);}
  .status-tag.approved{background:#E4EDE2;color:var(--ledger);}
  .status-tag.paid{background:#DFE7F0;color:#2C4A6E;}
  .status-tag.rejected{background:#F6E4E2;color:var(--stamp);}

  .entry-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .entry-actions button{
    flex:1;min-width:90px;padding:8px 10px;border-radius:4px;font-size:.8rem;
    font-family:inherit;cursor:pointer;border:1px solid var(--ink);background:#fff;font-weight:700;
  }
  .entry-actions button.approve{border-color:var(--ledger);color:var(--ledger);}
  .entry-actions button.reject{border-color:var(--stamp);color:var(--stamp);}
  .entry-actions button.paid{border-color:#2C4A6E;color:#2C4A6E;}
  .timeline{font-size:.72rem;color:var(--ink-soft);margin-top:6px;line-height:1.6;}

  .section-title{
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size:.95rem;
    color:var(--ink);
    border-bottom:1px solid var(--line);
    padding-bottom:6px;
    margin:20px 0 14px;
  }
  .section-title:first-child{margin-top:0;}

  .item-block{
    background:var(--paper2);
    border:1px solid var(--line);
    border-radius:6px;
    padding:14px 14px 4px;
    margin-bottom:12px;
    position:relative;
  }
  .item-block-head{
    display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;
  }
  .item-index{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:.78rem;
    color:var(--ink-soft);
  }
  .remove-item-btn{
    background:none;border:1px solid var(--stamp);color:var(--stamp);
    font-size:.72rem;padding:3px 9px;border-radius:10px;cursor:pointer;font-family:inherit;
  }
  .add-item-btn{
    width:100%;padding:10px;background:none;border:1.5px dashed var(--ink-soft);
    color:var(--ink-soft);border-radius:6px;font-family:'Noto Serif TC', serif;
    font-size:.88rem;cursor:pointer;margin-bottom:16px;
  }
  .total-preview{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--ink);color:var(--paper);
    padding:12px 16px;border-radius:6px;margin-bottom:18px;
    font-family:'Noto Serif TC', serif;font-weight:700;
  }
  .total-preview span:last-child{
    font-family:'IBM Plex Mono', monospace;font-size:1.15rem;
  }

  .bar-block{margin-bottom:20px;}
  .bar-block h3{font-family:'Noto Serif TC',serif;font-size:.95rem;margin:0 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px;}
  .bar-item{margin-bottom:8px;}
  .bar-item .row{display:flex;justify-content:space-between;font-size:.78rem;color:var(--ink-soft);margin-bottom:3px;}
  .bar-track{background:var(--paper2);border-radius:3px;height:9px;overflow:hidden;}
  .bar-fill{background:var(--ink);height:100%;border-radius:3px;}
  .bar-fill.stamp-fill{background:var(--stamp);}

  .entry-list{margin-top:6px;}
  .entry{
    border:1px solid var(--line);
    border-radius:4px;
    padding:12px 14px;
    margin-bottom:8px;
    background:#fff;
    font-size:.85rem;
  }
  .entry .top-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;}
  .entry .name{font-weight:700;}
  .entry .amt{font-family:'IBM Plex Mono',monospace;font-weight:700;}
  .entry .meta{color:var(--ink-soft);font-size:.75rem;}
  .entry .tag{
    display:inline-block;
    font-size:.68rem;
    padding:1px 7px;
    border-radius:10px;
    border:1px solid var(--ink-soft);
    color:var(--ink-soft);
    margin-right:6px;
  }
  .entry .tag.pending{border-color:var(--stamp);color:var(--stamp);}
  .item-list{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;}
  .item-row{font-size:.8rem;padding:3px 0;overflow:hidden;}
  .empty-note{color:var(--ink-soft);font-size:.85rem;text-align:center;padding:30px 0;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<header>
  <h1>協會請款系統</h1>
  <p>填單即匯整・自動彙整每月請款儀表板</p>
  <nav>
    <button class="tab-btn active" data-tab="form">📋 填寫請款</button>
    <button class="tab-btn" data-tab="dash">📊 請款總表</button>
    <button class="tab-btn" data-tab="admin">🖊 財務審核</button>
  </nav>
</header>

<main>

  <!-- ===== 表單 ===== -->
  <section id="view-form" class="view active">
    <div class="sheet">
      <form id="claimForm">

        <div class="section-title">請款人資訊</div>

        <div class="field">
          <label>請款人姓名</label>
          <input type="text" id="f_name">
        </div>

        <div class="field">
          <label>銀行代號</label>
          <input type="text" id="f_bankcode" placeholder="例：808">
        </div>

        <div class="field">
          <label>銀行帳號</label>
          <input type="text" id="f_acct" placeholder="請填寫完整銀行帳號">
        </div>

        <div class="field">
          <label>銀行抬頭</label>
          <input type="text" id="f_bankname" placeholder="請填寫戶名">
        </div>

        <div class="section-title">請款項目</div>
        <div id="itemsContainer"></div>

        <button type="button" class="add-item-btn" id="addItemBtn">＋ 新增一筆項目</button>

        <div class="total-preview">
          <span>總請款金額</span>
          <span id="totalPreview">NT$0</span>
        </div>

        <div class="field">
          <label>發票 / 明細照片</label>
          <div class="photo-drop" id="photoDrop">
            <div class="placeholder" id="photoPlaceholder">點此上傳發票或明細截圖（需包含品項與總金額）</div>
            <img id="photoPreview" style="display:none;">
          </div>
          <input type="file" id="f_photo" accept="image/*" style="display:none;">
        </div>

        <div class="field">
          <label>備註</label>
          <textarea id="f_note" placeholder="其他補充說明"></textarea>
        </div>

        <button type="button" class="submit-btn" id="submitBtn">送出請款</button>
      </form>

      <div class="confirm-box" id="confirmBox">
        <div class="stamp" id="stampEl">
          <div class="big">已收件</div>
          <div class="small">RECEIVED</div>
        </div>
        <div style="font-weight:700;margin-top:6px;">請款資料已送出</div>
        <div style="color:var(--ink-soft);font-size:.82rem;margin-top:2px;">資料已同步至請款總表</div>
        <button class="reset" id="resetBtn">再填一筆</button>
      </div>
    </div>
  </section>

  <!-- 單筆項目模板（JS 用來複製產生新項目區塊） -->
  <template id="itemTemplate">
    <div class="item-block">
      <div class="item-block-head">
        <span class="item-index"></span>
        <button type="button" class="remove-item-btn">✕ 移除</button>
      </div>
      <div class="field">
        <label>請款類別</label>
        <select class="item-type">
          <option value="文具用品">文具用品</option>
          <option value="交通費">交通費</option>
          <option value="餐飲費">餐飲費</option>
          <option value="場地租借">場地租借</option>
          <option value="印刷費">印刷費</option>
          <option value="郵資">郵資</option>
          <option value="活動雜支">活動雜支</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div class="field">
        <label>項目名稱</label>
        <input type="text" class="item-name" placeholder="請說明此筆項目名稱">
      </div>
      <div class="field">
        <label>發票號碼</label>
        <input type="text" class="item-invoice" placeholder="請填寫發票號碼">
      </div>
      <div class="field">
        <label>用途說明</label>
        <input type="text" class="item-desc" placeholder="請簡述採購項目或用途">
      </div>
      <div class="field" style="margin-bottom:0;">
        <label>金額</label>
        <div class="amount-wrap">
          <input type="number" class="item-amount" min="0" step="1">
        </div>
      </div>
    </div>
  </template>

  <!-- ===== 儀表板 ===== -->
  <section id="view-dash" class="view">

    <div class="sync-indicator" id="syncIndicator">🔄 讀取中...</div>

    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:0;">
      <select id="monthFilter"></select>
      <button id="exportBtn" class="export-btn">⬇ 匯出 Excel</button>
      <button id="refreshStatusBtn" class="export-btn refresh-btn">🔄 重新整理</button>
    </div>

    <div class="stat-row">
      <div class="stat-card">
        <div class="label">本月請款總額</div>
        <div class="value" id="statTotal">NT$0</div>
      </div>
      <div class="stat-card">
        <div class="label">本月筆數</div>
        <div class="value" id="statCount">0</div>
      </div>
    </div>

    <div class="bar-block">
      <h3>請款類型統計</h3>
      <div id="typeBars"></div>
    </div>

    <div class="bar-block">
      <h3>請款明細</h3>
      <div class="entry-list" id="entryList"></div>
    </div>
  </section>

  <!-- ===== 財務審核 ===== -->
  <section id="view-admin" class="view">

    <div class="sheet" id="pinGate">
      <div class="field">
        <label>審核密碼</label>
        <input type="text" id="pinInput" placeholder="請輸入財務審核密碼">
      </div>
      <button type="button" class="submit-btn" id="pinSubmit">進入審核頁面</button>
      <div class="hint" id="pinHint" style="margin-top:8px;"></div>
    </div>

    <div id="adminPanel" style="display:none;">
      <div class="sheet" style="padding:14px 16px;margin-bottom:16px;">
        <div class="field" style="margin-bottom:0;">
          <label>審核人姓名（核准／退回時會留存紀錄）</label>
          <input type="text" id="reviewerName" placeholder="請輸入你的姓名">
        </div>
      </div>

      <label style="display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--ink-soft);margin-bottom:12px;">
        <input type="checkbox" id="showAllToggle" style="width:auto;">
        顯示所有狀態（預設只顯示待審核）
      </label>

      <div class="entry-list" id="adminList"></div>
    </div>

  </section>

</main>

<script>
// ⚙️ 系統設定 —— 這是唯一的資料庫來源，要換 Sheet 或改密碼就改這裡
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbwyet1oEcPXc0jFyVCTB_xP7Qs6EYKsfdxVgllZDdW-y-dznpEPj7a4n9nHca_ZKP53/exec';
const ADMIN_PIN = '123456'; // 財務審核密碼

let claims = [];
let photoData = null;
let adminVerified = false;
let statusMap = {}; // id -> {status, reason, reviewedAt, reviewer, paidAt}

const $ = id => document.getElementById(id);

// tabs
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    btn.classList.add('active');
    $('view-'+btn.dataset.tab).classList.add('active');
    if(btn.dataset.tab==='dash') renderDash();
    if(btn.dataset.tab==='admin') openAdminTab();
  });
});

function openAdminTab(){
  if(!ADMIN_PIN || adminVerified){
    $('pinGate').style.display='none';
    $('adminPanel').style.display='block';
    renderAdmin();
  }else{
    $('pinGate').style.display='block';
    $('adminPanel').style.display='none';
  }
}

$('pinSubmit').addEventListener('click', ()=>{
  const val = $('pinInput').value.trim();
  if(val === ADMIN_PIN){
    adminVerified = true;
    $('pinHint').textContent = '';
    openAdminTab();
  }else{
    $('pinHint').textContent = '密碼錯誤，請再試一次';
  }
});

// ===== 動態項目管理 =====
let itemCounter = 0;

function addItemBlock(){
  itemCounter++;
  const tpl = $('itemTemplate').content.cloneNode(true);
  const block = tpl.querySelector('.item-block');
  block.dataset.itemId = 'i_' + itemCounter;
  block.querySelector('.item-index').textContent = '項目 #' + itemCounter;
  block.querySelector('.remove-item-btn').addEventListener('click', ()=>{
    block.remove();
    renumberItems();
    recalcTotal();
  });
  block.querySelectorAll('.item-amount').forEach(inp=>{
    inp.addEventListener('input', recalcTotal);
  });
  $('itemsContainer').appendChild(block);
  updateRemoveButtons();
}

function renumberItems(){
  const blocks = $('itemsContainer').querySelectorAll('.item-block');
  blocks.forEach((b,i)=>{ b.querySelector('.item-index').textContent = '項目 #' + (i+1); });
  updateRemoveButtons();
}

function updateRemoveButtons(){
  const blocks = $('itemsContainer').querySelectorAll('.item-block');
  blocks.forEach(b=>{
    b.querySelector('.remove-item-btn').style.display = blocks.length > 1 ? 'inline-block' : 'none';
  });
}

function recalcTotal(){
  const amounts = [...$('itemsContainer').querySelectorAll('.item-amount')]
    .map(i=> Number(i.value) || 0);
  const total = amounts.reduce((a,b)=>a+b, 0);
  $('totalPreview').textContent = 'NT$' + total.toLocaleString();
  return total;
}

function collectItems(){
  return [...$('itemsContainer').querySelectorAll('.item-block')].map((b, i)=>({
    type: b.querySelector('.item-type').value,
    itemName: b.querySelector('.item-name').value.trim(),
    invoiceNo: b.querySelector('.item-invoice').value.trim(),
    desc: b.querySelector('.item-desc').value.trim(),
    amount: Number(b.querySelector('.item-amount').value) || 0
  }));
}

$('addItemBtn').addEventListener('click', addItemBlock);

// photo upload
$('photoDrop').addEventListener('click', ()=> $('f_photo').click());
$('f_photo').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    photoData = ev.target.result;
    $('photoPreview').src = photoData;
    $('photoPreview').style.display='block';
    $('photoPlaceholder').style.display='none';
  };
  reader.readAsDataURL(file);
});

function resetForm(){
  $('claimForm').reset();
  photoData = null;
  $('photoPreview').style.display='none';
  $('photoPlaceholder').style.display='block';
  $('itemsContainer').innerHTML = '';
  itemCounter = 0;
  addItemBlock();
  recalcTotal();
  $('claimForm').style.display='block';
  $('confirmBox').style.display='none';
}

$('resetBtn').addEventListener('click', resetForm);

$('submitBtn').addEventListener('click', async ()=>{
  const btn = $('submitBtn');

  const name = $('f_name').value.trim();
  const bankCode = $('f_bankcode').value.trim();
  const acct = $('f_acct').value.trim();
  const bankName = $('f_bankname').value.trim();

  if(!name){ alert('請填寫請款人姓名'); $('f_name').focus(); return; }
  if(!bankCode){ alert('請填寫銀行代號'); $('f_bankcode').focus(); return; }
  if(!acct){ alert('請填寫銀行帳號'); $('f_acct').focus(); return; }
  if(!bankName){ alert('請填寫銀行抬頭'); $('f_bankname').focus(); return; }

  const items = collectItems();
  if(!items.length || items.some(it=>!it.desc || it.amount<=0)){
    alert('請確認每一筆項目都已填寫用途說明，且金額大於 0');
    return;
  }

  btn.disabled = true; btn.textContent = '送出中...';

  const totalAmount = items.reduce((s,it)=>s+it.amount, 0);

  const entry = {
    id: 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    name: name,
    bankCode: bankCode,
    acct: acct,
    bankName: bankName,
    items: items,
    amount: totalAmount,
    hasPhoto: !!photoData,
    note: $('f_note').value.trim(),
    submittedAt: new Date().toISOString()
  };

  try{
    const res = await fetch(SHEET_URL, {
      method: 'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'submit', ...entry, photoData: photoData || '' })
    });
    const result = await res.json();
    if(!result || result.status !== 'ok'){
      throw new Error((result && result.message) || '伺服器回應異常');
    }
  }catch(err){
    console.error(err);
    alert('送出失敗，請檢查網路連線後再試一次。\n錯誤訊息：' + err.message);
    btn.disabled=false; btn.textContent='送出請款';
    return;
  }

  // 送出成功後，背景重新整理本地資料（不阻擋畫面）
  loadClaims();

  btn.disabled=false; btn.textContent='送出請款';
  $('claimForm').style.display='none';
  $('confirmBox').style.display='block';
  $('stampEl').style.display='flex';
});

async function loadClaims(){
  const indicator = $('syncIndicator');
  if(indicator) indicator.textContent = '🔄 讀取中...';
  try{
    const res = await fetch(SHEET_URL, {method:'GET'});
    const rows = await res.json();

    const map = {};
    rows.forEach(r=>{
      if(!r.id) return;
      if(!map[r.id]){
        map[r.id] = {
          id: r.id,
          name: r.name || '',
          bankCode: r.bankCode || '',
          acct: r.acct || '',
          bankName: r.bankName || '',
          items: [],
          amount: 0,
          hasPhoto: false,
          photoUrl: '',
          note: r.note || '',
          submittedAt: r.submittedAt || r.date || ''
        };
      }
      const c = map[r.id];
      c.items.push({
        type: r.type || '',
        itemName: r.itemName || '',
        invoiceNo: r.invoiceNo || '',
        desc: r.desc || '',
        amount: Number(r.amount) || 0
      });
      c.amount += Number(r.amount) || 0;
      if(r.photoUrl){ c.hasPhoto = true; c.photoUrl = r.photoUrl; }
    });

    claims = Object.values(map).sort((a,b)=> (a.submittedAt||'').localeCompare(b.submittedAt||''));

    const newStatusMap = {};
    rows.forEach(r=>{
      if(r.id && !newStatusMap[r.id]){
        newStatusMap[r.id] = {
          status: r.status || '待審核',
          reason: r.reason || '',
          reviewedAt: r.reviewedAt || '',
          reviewer: r.reviewer || '',
          paidAt: r.paidAt || ''
        };
      }
    });
    statusMap = newStatusMap;

    if(indicator) indicator.textContent = '✅ 已同步 Google Sheet（' + claims.length + ' 筆申請單）';
  }catch(err){
    console.error('讀取 Sheet 資料失敗', err);
    if(indicator) indicator.textContent = '⚠️ 讀取失敗，請檢查網路後點「🔄 重新整理」';
  }
}

function monthKey(iso){ return (iso||'').slice(0,7); }

function statusClass(s){
  if(s==='已核准') return 'approved';
  if(s==='已匯款') return 'paid';
  if(s==='已退回') return 'rejected';
  return 'pending';
}

async function refreshStatuses(){
  await loadClaims();
  renderDash();
  if($('view-admin').classList.contains('active') && adminVerified) renderAdmin();
}

function renderDash(){
  const months = [...new Set(claims.map(c=>monthKey(c.submittedAt)))].sort().reverse();
  const sel = $('monthFilter');
  const prev = sel.value;
  sel.innerHTML = '<option value="all">全部月份</option>' + months.map(m=>`<option value="${m}">${m}</option>`).join('');
  sel.value = months.includes(prev) ? prev : 'all';

  const filtered = sel.value==='all' ? claims : claims.filter(c=>monthKey(c.submittedAt)===sel.value);

  const total = filtered.reduce((s,c)=>s+c.amount,0);
  $('statTotal').textContent = 'NT$' + total.toLocaleString();
  $('statCount').textContent = filtered.length;

  // type bars（依項目類別加總金額，跨所有申請單攤平計算）
  const byType = {};
  filtered.forEach(c=>{
    (c.items||[]).forEach(it=>{
      byType[it.type] = (byType[it.type]||0) + it.amount;
    });
  });
  const maxT = Math.max(1, ...Object.values(byType));
  $('typeBars').innerHTML = Object.keys(byType).length ? Object.entries(byType)
    .sort((a,b)=>b[1]-a[1])
    .map(([t,v])=>`
      <div class="bar-item">
        <div class="row"><span>${t}</span><span>NT$${v.toLocaleString()}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${(v/maxT*100).toFixed(0)}%"></div></div>
      </div>
    `).join('') : '<div class="empty-note">尚無資料</div>';

  // entry list
  $('entryList').innerHTML = filtered.length ? filtered
    .slice().reverse()
    .map(c=>{
      const st = statusMap[c.id] || {status:'待審核', reason:''};
      const cls = statusClass(st.status);
      const itemsHtml = (c.items||[]).map(it=>`
        <div class="item-row">
          <span class="tag">${it.type}</span>${it.itemName ? ' '+it.itemName : ''}
          ${it.desc ? ' － '+it.desc : ''}
          <span style="float:right;font-family:'IBM Plex Mono',monospace;">NT$${it.amount.toLocaleString()}</span>
        </div>`).join('');
      return `
      <div class="entry">
        <div class="top-row">
          <span class="name">${c.name || '（未填姓名）'}</span>
          <span class="amt">NT$${c.amount.toLocaleString()}</span>
        </div>
        <div class="meta">
          <span class="status-tag ${cls}">${st.status}</span>
          ${c.hasPhoto ? '📎已附照片' : '⚠️未附照片'} ・ ${c.submittedAt.slice(0,10)}
        </div>
        <div class="item-list">${itemsHtml}</div>
        ${st.status==='已退回' && st.reason ? `<div style="margin-top:6px;color:var(--stamp);font-size:.78rem;">退回原因：${st.reason}</div>` : ''}
        <div class="timeline">
          登記時間：${fmtTime(c.submittedAt)}
          ${st.reviewedAt ? `<br>審核時間：${fmtTime(st.reviewedAt)}${st.reviewer ? '（審核人：'+st.reviewer+'）' : ''}` : ''}
          ${st.paidAt ? `<br>匯款時間：${fmtTime(st.paidAt)}` : ''}
        </div>
      </div>`;
    }).join('') : '<div class="empty-note">此月份尚無請款紀錄</div>';
}

function fmtTime(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  return d.toLocaleString('zh-TW', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}

$('monthFilter').addEventListener('change', renderDash);

$('showAllToggle').addEventListener('change', renderAdmin);

function renderAdmin(){
  const showAll = $('showAllToggle').checked;
  const list = claims
    .map(c=>({ c, st: statusMap[c.id] || {status:'待審核', reason:'', reviewedAt:'', reviewer:'', paidAt:''} }))
    .filter(x=> showAll || x.st.status==='待審核')
    .slice().reverse();

  $('adminList').innerHTML = list.length ? list.map(({c, st})=>{
    const cls = statusClass(st.status);
    let actions = '';
    if(st.status==='待審核'){
      actions = `
        <div class="entry-actions">
          <button class="approve" onclick="updateClaimStatus('${c.id}','已核准')">✅ 核准</button>
          <button class="reject" onclick="promptReject('${c.id}')">❌ 退回</button>
        </div>`;
    }else if(st.status==='已核准'){
      actions = `
        <div class="entry-actions">
          <button class="paid" onclick="updateClaimStatus('${c.id}','已匯款')">💰 標記已匯款</button>
          <button class="reject" onclick="promptReject('${c.id}')">❌ 退回</button>
        </div>`;
    }
    return `
      <div class="entry">
        <div class="top-row">
          <span class="name">${c.name || '（未填姓名）'}</span>
          <span class="amt">NT$${c.amount.toLocaleString()}</span>
        </div>
        <div class="meta">
          <span class="status-tag ${cls}">${st.status}</span>
          ${c.hasPhoto ? '📎已附照片' : '⚠️未附照片'}
        </div>
        <div class="item-list">
          ${(c.items||[]).map(it=>`
            <div class="item-row">
              <span class="tag">${it.type}</span>${it.itemName ? ' '+it.itemName : ''}
              （發票：${it.invoiceNo||'—'}）－ ${it.desc||'—'}
              <span style="float:right;font-family:'IBM Plex Mono',monospace;">NT$${it.amount.toLocaleString()}</span>
            </div>`).join('')}
        </div>
        <div style="margin-top:8px;font-size:.85rem;border-top:1px dashed var(--line);padding-top:8px;">
          銀行：${c.bankCode||'—'} / ${c.acct||'—'} / ${c.bankName||'—'}
        </div>
        ${st.status==='已退回' && st.reason ? `<div style="margin-top:6px;color:var(--stamp);font-size:.78rem;">退回原因：${st.reason}</div>` : ''}
        <div class="timeline">
          登記時間：${fmtTime(c.submittedAt)}
          ${st.reviewedAt ? `<br>審核時間：${fmtTime(st.reviewedAt)}${st.reviewer ? '（審核人：'+st.reviewer+'）' : ''}` : ''}
          ${st.paidAt ? `<br>匯款時間：${fmtTime(st.paidAt)}` : ''}
        </div>
        ${actions}
      </div>`;
  }).join('') : '<div class="empty-note">目前沒有符合條件的請款紀錄</div>';
}

function promptReject(id){
  const reason = window.prompt('請輸入退回原因：');
  if(reason === null) return; // 使用者取消
  updateClaimStatus(id, '已退回', reason.trim());
}

async function updateClaimStatus(id, status, reason){
  const reviewer = $('reviewerName').value.trim();
  if(!reviewer){ alert('請先在上方填寫審核人姓名'); return; }

  const timestamp = new Date().toISOString();
  const prevStatus = statusMap[id] || {};

  // 先在畫面上樂觀更新，讓操作看起來即時
  statusMap[id] = {
    status,
    reason: reason || '',
    reviewedAt: (status==='已核准'||status==='已退回') ? timestamp : (prevStatus.reviewedAt||''),
    reviewer: (status==='已核准'||status==='已退回') ? reviewer : (prevStatus.reviewer||''),
    paidAt: status==='已匯款' ? timestamp : (prevStatus.paidAt||'')
  };
  renderAdmin();
  renderDash();

  try{
    const res = await fetch(SHEET_URL, {
      method: 'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'update_status', id, status, reason: reason||'', reviewer, timestamp })
    });
    const result = await res.json();
    if(!result || result.status !== 'ok') throw new Error((result && result.message) || '伺服器回應異常');
  }catch(err){
    console.error('狀態更新失敗', err);
    alert('狀態更新失敗，請檢查網路後再試一次（畫面已還原）');
    statusMap[id] = prevStatus;
    renderAdmin();
    renderDash();
  }
}



$('refreshStatusBtn').addEventListener('click', refreshStatuses);

$('exportBtn').addEventListener('click', ()=>{
  if(!claims.length){ alert('目前尚無資料可匯出'); return; }

  // 明細工作表（每筆項目各自一列）
  const detailRows = [];
  claims.forEach(c=>{
    (c.items||[]).forEach(it=>{
      detailRows.push({
        '編號': c.id,
        '日期': c.submittedAt.slice(0,10),
        '姓名': c.name,
        '請款項目': it.type,
        '項目名稱': it.itemName,
        '發票號碼': it.invoiceNo,
        '用途說明': it.desc,
        '金額': it.amount,
        '申請總金額': c.amount,
        '銀行代號': c.bankCode,
        '銀行帳號': c.acct,
        '銀行抬頭': c.bankName,
        '附照片': c.hasPhoto ? '是' : '否',
        '備註': c.note
      });
    });
  });
  const wsDetail = XLSX.utils.json_to_sheet(detailRows);
  wsDetail['!cols'] = [
    {wch:16},{wch:11},{wch:10},{wch:12},{wch:14},{wch:14},
    {wch:26},{wch:10},{wch:12},{wch:10},{wch:10},{wch:16},{wch:8},{wch:22}
  ];

  // 月統計工作表（依申請單總金額）
  const byMonth = {};
  claims.forEach(c=>{
    const m = monthKey(c.submittedAt);
    byMonth[m] = byMonth[m] || {總金額:0, 筆數:0};
    byMonth[m].總金額 += c.amount;
    byMonth[m].筆數 += 1;
  });
  const summaryRows = Object.keys(byMonth).sort().map(m=>({
    '月份': m,
    '總金額': byMonth[m].總金額,
    '申請單筆數': byMonth[m].筆數
  }));
  const wsSummary = XLSX.utils.json_to_sheet(summaryRows);
  wsSummary['!cols'] = [{wch:10},{wch:12},{wch:10}];

  // 項目別統計工作表（依項目類別攤平）
  const byType = {};
  claims.forEach(c=>{
    (c.items||[]).forEach(it=>{
      byType[it.type] = byType[it.type] || {總金額:0, 筆數:0};
      byType[it.type].總金額 += it.amount;
      byType[it.type].筆數 += 1;
    });
  });
  const typeRows = Object.entries(byType)
    .sort((a,b)=>b[1].總金額-a[1].總金額)
    .map(([t,v])=>({'請款項目':t, '總金額':v.總金額, '筆數':v.筆數}));
  const wsType = XLSX.utils.json_to_sheet(typeRows);
  wsType['!cols'] = [{wch:12},{wch:12},{wch:8}];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, wsDetail, '請款明細');
  XLSX.utils.book_append_sheet(wb, wsSummary, '月統計');
  XLSX.utils.book_append_sheet(wb, wsType, '項目統計');

  const today = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `協會請款資料_${today}.xlsx`);
});

(async ()=>{
  addItemBlock();
  await loadClaims();
  renderDash();
})();
</script>
